[project]
name = "callisto"
version = "1.4.2"
description = "A service to manage browser pods in k8s"
authors = [{ name = "Wrike DevOps team", email = "devops+oss@team.wrike.com" }]
requires-python = ">=3.14"
license = "MIT"
keywords = [
    "web",
    "service",
    "ci",
    "automation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "aiodns>=4.0.4,<5",
    "aiojobs>=1.4.0,<2",
    "kubernetes-asyncio>=36.1.0,<37",
    "click>=8.5.0,<9",
    "prometheus-client>=0.26.0,<0.27",
    "sentry-sdk>=2.73.0,<3",
    "tenacity>=9.2.1,<10",
    "graypy>=2.1.0,<3",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository = "https://github.com/wrike/callisto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "mypy>=2.4.0",
    "selenium>=4.51.0",
    "types-pyyaml>=6.0.12.20260906",
    "ruff>=0.17.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "tests",
    "*.tests",
]
wheel-exclude = [
    "tests",
    "*.tests",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = """
    --strict-markers
    --quiet
    --no-cov-on-fail
    --asyncio-mode=auto
"""

[tool.mypy]
python_version = 3.14
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
# Too noisy
warn_no_return = false
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = 'py314'

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = true
lines-after-imports = 2
forced-separate = ["callisto"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
]
