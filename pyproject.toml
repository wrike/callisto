[project]
name = "callisto"
version = "1.4.0"
description = "A service to manage browser pods in k8s"
authors = [{ name = "Wrike DevOps team", email = "devops+oss@team.wrike.com" }]
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "web",
    "service",
    "ci",
    "automation",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.9.5,<4",
    "aiodns>=4.0.0,<5",
    "aiojobs>=1.2.1,<2",
    "kubernetes_asyncio>=33.0.0,<34",
    "click>=8.1.7,<9",
    "prometheus-client>=0.23.0,<0.24",
    "sentry-sdk>=2.2.0,<3",
    "tenacity>=9.0.0,<10",
    "graypy>=2.1.0,<3",
    "pyyaml>=6.0,<7",
]

[project.urls]
Repository = "https://github.com/wrike/callisto"

[dependency-groups]
dev = [
    "pytest>=5.3.2",
    "pytest-asyncio>=0.10.0",
    "pytest-cov>=2.8.1",
    "flake8>=3.7.9",
    "mypy>=0.750",
    "isort>=4.3.21",
    "toml>=0.10",
    "selenium>=4.10.0",
    "types-pyyaml>=6.0.12.10",
    "black>=23.3.0",
    "async-timeout>=4.0.3",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""
source-exclude = [
    "tests",
    "*.tests",
]
wheel-exclude = [
    "tests",
    "*.tests",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.12.0"]
build-backend = "uv_build"

[tool.isort]
line_length = 120
multi_line_output = 3
include_trailing_comma = true
lines_after_imports = 2
force_grid_wrap = 3
forced_separate = ["callisto"]
add_imports = "from __future__ import annotations"

[tool.pytest.ini_options]
addopts = """
    --strict-markers
    --quiet
    --no-cov-on-fail
    --asyncio-mode=auto
"""

[tool.mypy]
python_version = 3.12
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
# Too noisy
warn_no_return = false
warn_return_any = false
